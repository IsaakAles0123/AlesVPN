# AMS-нода: HTTPS подписка для Happ (NL рекомендуемый + DE запасной).
# Перед этим Reality на AMS лучше перенести с 443 на 8443 (иначе конфликт порта).
#
# DNS: nl.alesvpn.ru → A 129.101.122.146
# certbot --nginx -d nl.alesvpn.ru
# Скопировать в /etc/nginx/sites-available/alesvpn-sub и ln -s в sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name nl.alesvpn.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nl.alesvpn.ru;

    # ssl_certificate /etc/letsencrypt/live/nl.alesvpn.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nl.alesvpn.ru/privkey.pem;

    location /s/ {
        proxy_pass http://127.0.0.1:8091/s/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8091/healthz;
    }
}
